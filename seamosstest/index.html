<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Super Seamoss · Animation Test</title><meta name="robots" content="noindex, nofollow">
<style>
*{box-sizing:border-box}html{background:#d8c5aa;color:#20271f;font-family:Arial,sans-serif}body{margin:0}header{position:fixed;inset:0 0 auto;display:flex;justify-content:space-between;align-items:center;padding:22px 5vw;z-index:3;font-size:13px}header strong{letter-spacing:-.03em;font-size:22px}a{color:inherit;text-decoration:none;border-bottom:1px solid;padding-bottom:3px}.track{height:340svh}.stage{height:100svh;position:sticky;top:0;overflow:hidden;background:url(stone.webp) center/cover}.copy{position:absolute;top:14vh;width:100%;text-align:center;z-index:0;font-size:clamp(40px,8vw,112px);line-height:.96;letter-spacing:-.07em;font-weight:700;margin:0}.copy span{color:#4c5a38}canvas{position:absolute;width:min(100%,1280px);height:calc(100svh - 270px);left:50%;top:190px;transform:translateX(-50%);object-fit:contain;z-index:1}.hint{position:absolute;bottom:40px;left:0;right:0;text-align:center;font-size:14px}.bar{height:2px;position:absolute;bottom:0;left:0;background:#4c5a38;width:var(--progress,0%)}.finish{padding:90px 24px;text-align:center;background:#ede3d3}.finish h2{font-size:clamp(32px,6vw,72px);letter-spacing:-.06em;margin:0 0 30px}.finish a{font-size:18px} @media(max-width:600px){header{padding:18px 20px}header strong{font-size:18px}.copy{top:19svh}canvas{top:150px;height:calc(100svh - 250px);width:100%;max-width:800px}.hint{bottom:50px}}@media(prefers-reduced-motion:reduce){.track{height:100svh}}
</style>
<style>
.track{height:310svh}.copy{top:12svh;padding:0 4vw;font-size:clamp(30px,7.7vw,112px)}
.origin-copy{pointer-events:none;top:10svh;font-size:clamp(28px,4vw,56px);line-height:1.08;letter-spacing:-.055em;display:flex;flex-direction:column;gap:8px}.origin-copy h2{font:inherit;margin:0;opacity:0}.place-copy{color:#4c5a38}
@media(max-width:600px){.copy{top:18svh}.origin-copy{top:16svh;font-size:clamp(26px,5.4vw,32px)}}
@media(prefers-reduced-motion:reduce){.track{height:100svh}.intro-copy{display:none}.origin-copy{top:10svh}}
</style>
<header><strong>Super Seamoss</strong><a href="video.html">Watch video ↗</a></header>
<main><section class="track"><div class="stage"><h1 class="copy intro-copy">Super Seamoss.<br><span>Daily Nourishment.</span></h1><div class="copy origin-copy"><h2 class="source-copy" aria-hidden="true">Sourced organically.</h2><h2 class="place-copy" aria-hidden="true">St Lucia and Jamaica.</h2></div><canvas width="960" height="540" aria-label="Scroll to open the jar and reveal thicker sea moss gel and ingredients"></canvas><div class="hint">Scroll to open ↓</div><div class="bar"></div></div></section><section class="finish"><h2>A little jar.<br>A big reveal.</h2><a href="video.html">Review the video →</a></section></main>
<script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),track=document.querySelector('.track'),hint=document.querySelector('.hint'),copy=document.querySelector('.intro-copy'),sourceCopy=document.querySelector('.source-copy'),placeCopy=document.querySelector('.place-copy');let frames=[],target=0,current=0,last=-1,prev=performance.now();let reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp=n=>Math.max(0,Math.min(1,n));
const fade=(p,start,end)=>{const t=clamp((p-start)/(end-start));return t*t*(3-2*t)};
function scroll(){target=reduced?1:clamp(-track.getBoundingClientRect().top/(track.offsetHeight-innerHeight));}addEventListener('scroll',scroll,{passive:true});addEventListener('resize',scroll);scroll();
async function load(){for(let batch=0;batch<96;batch+=8){await Promise.all(Array.from({length:Math.min(8,96-batch)},async(_,k)=>{const i=batch+k,img=new Image();img.src=`scroll-frames/${String(i).padStart(3,'0')}.webp?v=honeyedge6`;await img.decode();frames[i]=img;if(i===0){ctx.drawImage(img,0,0);hint.textContent='Scroll to open ↓';}}));}}
function showCopy(el,opacity){el.style.opacity=opacity;const hidden=opacity<.01;if(el.getAttribute('aria-hidden')!==String(hidden))el.setAttribute('aria-hidden',String(hidden));}
function tick(now){let dt=Math.min(64,now-prev);prev=now;current+=(target-current)*(1-Math.exp(-dt/75));if(Math.abs(target-current)<.0001)current=target;const opening=clamp(current/.78),i=reduced?95:Math.round(opening*95);if(i!==last&&frames[i]){ctx.clearRect(0,0,960,540);ctx.drawImage(frames[i],0,0);last=i;}document.documentElement.style.setProperty('--progress',`${current*100}%`);showCopy(copy,reduced?0:1-fade(current,.08,.32));showCopy(sourceCopy,reduced?1:fade(current,.79,.85));showCopy(placeCopy,reduced?1:fade(current,.88,.95));hint.style.opacity=reduced?0:1-fade(current,0,.12);requestAnimationFrame(tick);}hint.textContent='Loading reveal…';load().catch(()=>{hint.innerHTML='<a href="video.html">Watch the video →</a>'});requestAnimationFrame(tick);
</script></html>
