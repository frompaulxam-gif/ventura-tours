<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Venture / Category QC answers</title><link rel="stylesheet" href="style.css"><header><h1>Category QC answers</h1><a href="index.html">Back to review</a></header><main id="results">Loading…</main><script src="config.js"></script><script src="data.js"></script><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),gn=id=>DATA.groups.find(g=>g.id===id)?.title||id;
fetch(STORE+'?t='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{const rows=d.submissions.sort((a,b)=>b.ts.localeCompare(a.ts));const totals={};for(const r of rows)for(const x of r.items||[]){totals[x.id]||={K:0,F:0,X:0};if(x.verdict in totals[x.id])totals[x.id][x.verdict]++}document.querySelector('#results').innerHTML=(rows.length?'<h2>Totals</h2><table><tr><th>Shot</th><th>Keep</th><th>Flag</th><th>Kill</th></tr>'+Object.entries(totals).map(([id,t])=>`<tr><td>${esc(id)}</td><td>${t.K}</td><td>${t.F}</td><td>${t.X}</td></tr>`).join('')+'</table>':'No answers sent yet.')+rows.map(r=>`<section><h2>${esc(r.name)}</h2><p>${esc(r.ts)}</p><table><tr><th>Shot</th><th>Action group</th><th>Angle</th><th>QC</th></tr>${r.items.filter(x=>x.verdict!=='-'||x.note||x.group!==x.proposed).map(x=>`<tr><td>${esc(x.id)}</td><td>${esc(gn(x.group))}</td><td>${esc(x.angle)}</td><td>${esc(x.verdict)}</td></tr>${x.note?`<tr><td colspan="4"><pre>${esc(x.note)}</pre></td></tr>`:''}`).join('')}</table><pre>${esc(r.overall)}</pre></section>`).join('')}).catch(()=>document.querySelector('#results').textContent='Could not load answers. Please retry.');
</script></html>
