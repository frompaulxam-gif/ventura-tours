<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Venture · Saved shoot notes</title><style>body{font:16px system-ui;background:#111917;color:#eee;max-width:1000px;padding:24px;margin:auto}a{color:inherit}article{border-top:1px solid #788575;margin:30px 0;padding-top:15px}pre{white-space:pre-wrap;color:#eed8a9;font:inherit}button{padding:12px;font:inherit}td,th{text-align:left;padding:8px;border-bottom:1px solid #556}table{width:100%;border-collapse:collapse}</style><a href="./">← Shoot board</a><h1>Saved shoot notes</h1><main id="results">Loading…</main><script src="config.js"></script><script>
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch(STORE+'?t='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{const rows=d.submissions.sort((a,b)=>(b.savedAt||'').localeCompare(a.savedAt||''));const totals={};for(const r of rows)for(const x of r.items||[]){totals[x.id]||={K:0,F:0,X:0};if(x.effectiveVerdict in totals[x.id])totals[x.id][x.effectiveVerdict]++}document.querySelector('#results').innerHTML=(rows.length?'<table><tr><th>Item</th><th>Keep</th><th>Flag</th><th>Kill</th></tr>'+Object.entries(totals).map(([id,t])=>'<tr><td>'+esc(id)+'</td><td>'+t.K+'</td><td>'+t.F+'</td><td>'+t.X+'</td></tr>').join('')+'</table>':'No answers sent yet.')+rows.map((r,i)=>'<article><h2>'+esc(r.name)+'</h2><p>'+esc(r.savedAt)+'</p><button data-load="'+i+'">Load these notes on this device</button>'+(r.items||[]).filter(x=>x.idea||x.cuts||x.fit||x.props||x.effectiveVerdict!=='-').map(x=>'<h3>'+esc(x.id)+' · '+esc(x.title)+' · '+esc(x.effectiveVerdict)+'</h3><pre>'+esc([['Venture version',x.idea],['Angles / cut list',x.cuts],['Outfit',x.fit],['Props / location',x.props]].map(([k,v])=>k+': '+(v||'')).join('\n'))+'</pre>').join('')+'<h3>Overall</h3><pre>'+esc(r.overall)+'</pre></article>').join('');document.querySelectorAll('[data-load]').forEach(b=>b.onclick=()=>{const r=rows[+b.dataset.load];const state={name:r.name,overall:r.overall,items:Object.fromEntries(r.items.map(x=>[x.id,{idea:x.idea||'',cuts:x.cuts||'',fit:x.fit||'',props:x.props||'',verdict:x.verdict||'-'}]))};const key='venture-shoot-20260922';const previous=localStorage.getItem(key);if(previous)localStorage.setItem(key+'-before-import-'+Date.now(),previous);localStorage.setItem(key,JSON.stringify(state));location.href='./'})}).catch(()=>document.querySelector('#results').textContent='Could not load answers. Your notes remain saved on the device where you entered them.');</script></html>
