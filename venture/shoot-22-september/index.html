<!doctype html><html lang="en"><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Venture · Tomorrow’s shoot notes</title><style>
*{box-sizing:border-box}body{margin:0;background:#111917;color:#efeee5;font:16px system-ui}header{padding:18px 5%;position:sticky;top:0;background:#111917f5;z-index:2;border-bottom:1px solid #46554b}h1{font-size:22px;margin:0 0 8px}p{line-height:1.55}button,a,input,textarea{font:inherit}button,a{color:inherit}button{background:#273b33;border:1px solid #627367;border-radius:7px;padding:10px;cursor:pointer}a{margin-right:18px}main{max-width:1300px;margin:auto}article{display:grid;grid-template-columns:minmax(250px,1fr) minmax(300px,1fr);gap:28px;padding:30px 20px;border-bottom:1px solid #46554b;scroll-margin-top:120px;min-height:85vh}video{width:100%;max-height:76vh;object-fit:contain;background:#080c0a;position:sticky;top:130px}label{display:block;margin:16px 0 6px;font-weight:600}textarea,input{width:100%;background:#f5f3e9;color:#17251d;border:1px solid #768477;border-radius:6px;padding:12px}textarea{min-height:82px;resize:vertical}.cuts{min-height:145px}.prior{white-space:pre-wrap;border-left:2px solid #b2b99c;padding-left:15px;color:#c5cfbf}.actions{display:flex;gap:8px;flex-wrap:wrap}.selected{outline:2px solid #f4dab0}.notice{color:#dcc49b}footer{padding:32px 5%}small{color:#bfc6bc}#save{background:#d9e3be;color:#152519}@media(max-width:720px){article{display:block}video{position:static;max-height:65vh}header{position:static}article{scroll-margin-top:10px}}
.shot-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.shot-grid figure{margin:0;background:#1c2923;border-radius:8px;overflow:hidden}.shot-grid video{position:static;max-height:310px;width:100%;display:block;object-fit:contain}.shot-grid figcaption{padding:12px;font-size:14px}.shot-grid p{margin:8px 0}.shot-help{font-size:14px;color:#bfc6bc}article>div>video{position:static}.shoot-status{color:#ead1a1}.shot-section{margin-top:28px}article>div{min-width:0}header small{display:block}@media(max-width:420px){.shot-grid{gap:8px}.shot-grid figcaption{padding:9px;font-size:13px}}@media print{header{position:static}video,.actions,button{display:none}article{display:block;min-height:0}body{background:white;color:black}}
</style><header><a href="shotboard.html" style="display:inline-block;background:#d9e3be;color:#152519;padding:10px 16px;border-radius:7px;margin-bottom:12px;font-weight:700">Open visual shotboard →</a><a href="shoot.html" style="display:inline-block;background:#d9e3be;color:#152519;padding:10px 16px;border-radius:7px;margin-bottom:12px;font-weight:700">Open simple shoot checklist →</a><h1>Venture / Tomorrow’s shoot notes</h1><small id="count"></small><p style="margin:7px 0">Enter → next video’s notes · Shift+Enter → new line · Saved on this device as you type · Send answers to back up online</p><div class="actions"><button id="save">Send answers</button><button id="copy">Copy answers</button><button id="download">Download notes</button><a href="results.html">Saved answers</a><span id="status" role="status"></span></div></header><main id="cards"></main><footer><label for="overall">Overall shoot notes</label><textarea id="overall"></textarea><label for="name">Name (optional)</label><input id="name" placeholder="Paul"></footer><script src="data.js?v=cuts1"></script><script src="config.js"></script><script>
const test=new URLSearchParams(location.search).has('test');const key='venture-shoot-20260922'+(test?'-test':'');let state;try{state=JSON.parse(localStorage.getItem(key))||{}}catch{state={}}state.items ||= {};if(!state.notesSeed20260922){for(const x of ITEMS){state.items[x.id]||={};if(!state.items[x.id].idea&&x.shootNote)state.items[x.id].idea=x.shootNote;}state.notesSeed20260922=true;localStorage.setItem(key,JSON.stringify(state));}const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fields=[['idea','Your Venture version'],['cuts','Angles / cut list'],['fit','Outfit / styling'],['props','Props / location / people']];
function save(){localStorage.setItem(key,JSON.stringify(state));const verdicts=ITEMS.map(x=>effective(state.items[x.id]||{})).join('');history.replaceState(null,'','#r='+verdicts);document.querySelector('#status').textContent='Saved in browser'}
function effective(s){return s.verdict==='X'?'X':fields.some(([k])=>(s[k]||'').trim())?'F':s.verdict||'-'}
const seeded=location.hash.match(/r=([KFX-]+)/);if(seeded)ITEMS.forEach((x,i)=>{if(seeded[1][i]){state.items[x.id]||={};state.items[x.id].verdict=seeded[1][i]}});
document.querySelector('#count').textContent=ITEMS.length+' references · '+ITEMS.reduce((n,x)=>n+(x.shots?.length||0),0)+' shot / action clips · 22 September 2026';
document.querySelector('#cards').innerHTML=ITEMS.map((x,i)=>{const s=state.items[x.id]||{};return `<article id="${x.id}"><div><video controls playsinline preload="none" src="${esc(x.video)}"></video><p class="notice" hidden>Download unavailable. Original source is saved below.</p><p><a href="${esc(x.source)}" target="_blank" rel="noopener">Original source ↗</a><a href="${esc(x.video)}" download>Save video</a></p>${x.shots?.length?`<section class="shot-section"><h3>${x.shots.length} shot / action clips</h3><p class="shot-help">Tap any clip to play. Short clips are slowed to at least 2 seconds. Times refer to the original video. “Action beat” means part of the same angle, not a new camera setup.</p><div class="shot-grid">${x.shots.map(sh=>`<figure><video controls playsinline preload="none" poster="${esc(sh.poster)}" src="${esc(sh.video)}?v=slow2"></video><figcaption><b>${esc(sh.id)} · ${sh.start.toFixed(2)}–${sh.end.toFixed(2)}s</b><p>${esc(sh.label)}</p><small>${esc(sh.kind)}</small><p><a href="${esc(sh.video)}?v=slow2" download>Save clip ↓</a></p></figcaption></figure>`).join('')}</div></section>`:''}</div><div><small>${i+1} / ${ITEMS.length} · ${x.id}</small><h2>${esc(x.title)}</h2><p class="shoot-status">${esc(x.shootStatus)}</p>${x.shootNote?`<p class="prior"><b>Your 22 September note</b><br>${esc(x.shootNote)}</p>`:''}${x.shotGuide?`<p><b>Shoot guidance</b><br>${esc(x.shotGuide)}</p>`:''}${x.previous?`<p class="prior"><b>Your existing QC note</b><br>${esc(x.previous)}</p>`:''}${x.observed?`<p><b>Reference</b><br>${esc(x.observed)}</p>`:''}${x.venture?`<p><b>Previous Venture suggestion</b><br>${esc(x.venture)}</p>`:''}<div class="actions">${[['K','Keep'],['F','Flag'],['X','Kill']].map(([v,t])=>`<button data-id="${x.id}" data-verdict="${v}" class="${s.verdict===v?'selected':''}">${t}</button>`).join('')}</div>${fields.map(([k,label])=>`<label for="${x.id}-${k}">${label}</label><textarea id="${x.id}-${k}" data-id="${x.id}" data-field="${k}" class="${k}" placeholder="${k==='cuts'?'1. Timecode / angle / action / movement\n2. Next shot…':'Add your notes…'}">${esc(s[k])}</textarea>`).join('')}<button data-next="${i}">Next video ↓</button></div></article>`}).join('');
function next(i){const x=ITEMS[i+1];if(!x)return;document.getElementById(x.id).scrollIntoView({behavior:'smooth'});document.getElementById(x.id+'-idea').focus({preventScroll:true})}
document.querySelectorAll('textarea[data-field]').forEach(el=>{el.addEventListener('input',()=>{state.items[el.dataset.id]||={};state.items[el.dataset.id][el.dataset.field]=el.value;save()});el.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();next(ITEMS.findIndex(x=>x.id===el.dataset.id))}})});
document.querySelectorAll('[data-verdict]').forEach(el=>el.onclick=()=>{const s=state.items[el.dataset.id]||={};s.verdict=el.dataset.verdict;el.parentNode.querySelectorAll('button').forEach(b=>b.classList.toggle('selected',b===el));save();if(s.verdict==='X')next(ITEMS.findIndex(x=>x.id===el.dataset.id))});document.querySelectorAll('[data-next]').forEach(el=>el.onclick=()=>next(+el.dataset.next));
for(const k of ['name','overall']){const el=document.getElementById(k);el.value=state[k]||'';el.oninput=()=>{state[k]=el.value;save()}}
function payload(){return {boardId:'venture-shoot-20260922',name:state.name||'',overall:state.overall||'',items:ITEMS.map(x=>({...x,...state.items[x.id],effectiveVerdict:effective(state.items[x.id]||{})}))}}
function text(){return 'Venture / 22 September shoot\n'+ITEMS.map(x=>{const s=state.items[x.id]||{};return '\n'+x.id+' — '+x.title+' | '+effective(s)+'\n'+x.source+'\n'+fields.map(([k,l])=>l+': '+(s[k]||'')).join('\n')}).join('\n')+'\nOverall: '+(state.overall||'')}
document.querySelector('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(text());document.querySelector('#status').textContent='Copied'}catch{const t=document.createElement('textarea');t.value=text();document.body.append(t);t.select();document.execCommand('copy');t.remove()}};
document.querySelector('#download').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(payload(),null,2)],{type:'application/json'}));a.download='venture-shoot-notes-2026-09-22.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
document.querySelector('#save').onclick=async()=>{const button=document.querySelector('#save');button.disabled=true;try{const r=await fetch(STORE+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error();const data=await r.json();if(!Array.isArray(data.submissions))throw Error();const entry={...payload(),name:state.name?.trim()||'Anonymous',savedAt:new Date().toISOString()};data.submissions=data.submissions.filter(x=>String(x.name||'Anonymous').toLowerCase()!==entry.name.toLowerCase());data.submissions.unshift(entry);const write=await fetch(STORE,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});if(!write.ok)throw Error();document.querySelector('#status').textContent='Answers sent'}catch{document.querySelector('#status').textContent='Send failed — notes kept on this device. Use Download notes.'}finally{button.disabled=false}};
const observer=new IntersectionObserver(es=>es.forEach(e=>{const v=e.target;if(e.isIntersecting){v.preload='metadata'}else v.pause()}),{rootMargin:'100px'});document.querySelectorAll('video').forEach(v=>{observer.observe(v);v.addEventListener('error',()=>v.nextElementSibling.hidden=false);v.addEventListener('play',()=>document.querySelectorAll('video').forEach(o=>{if(o!==v)o.pause()}))});
</script></html>
