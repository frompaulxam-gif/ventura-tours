<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>video review</title><link rel="stylesheet" href="style.css?v=20261024-really-like"></head><body>
<header><div><h1 id="title">video review</h1><p>tap a clip frame to dislike it. tap again to undo.</p></div><nav><label for="round">round</label><select id="round" aria-label="review round"></select><a id="results-link" href="results.html">saved answers</a></nav></header>
<main id="videos" aria-label="video review"><p class="loading">loading videos…</p></main>
<section class="feedback-area"><label for="overall">overall comment</label><textarea id="overall" placeholder="anything else about the edits"></textarea><label for="name">name <span>(optional)</span></label><input id="name" autocomplete="name" placeholder="your name"><section id="summary" aria-label="feedback summary"><h2>feedback summary</h2><p id="summary-counts" aria-live="polite"></p><div id="summary-details"></div></section></section>
<footer><span id="status" role="status">ready</span><div class="actions"><button id="copy">copy feedback</button><button id="download">download feedback</button><button id="save">save answers</button></div></footer>
<dialog id="copy-dialog"><label for="copy-text">copy feedback</label><textarea id="copy-text" readonly></textarea><button id="close-copy">close</button></dialog><script src="model.js?v=20261024-really-like"></script><script src="app.js?v=20261024-really-like" defer></script></body></html>
