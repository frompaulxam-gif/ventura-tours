<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8f8f5"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Jarvis Notes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="robots" content="noindex,nofollow"><title>Notes · Jarvis</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="stylesheet" href="notes.css"><script src="notes.js" defer></script></head>
<body><div class="shell"><header><a class="wordmark" href="./" aria-label="Jarvis Notes home"><span class="mark">j.</span> jarvis <span class="muted">/ notes</span></a><span class="device-status"><span class="dot"></span>on this device only</span></header>
<main><div class="intro"><h1>get it out of your head.</h1></div>
<form id="capture"><label for="note-text" class="sr-only">Your note</label><div class="composer"><div class="notebook" id="notebook"><div id="notes" aria-label="Saved notes"></div><div class="editor-tools"><button type="button" id="bullets" class="quiet" aria-label="Add hollow boxes" title="Hollow boxes">☐ <span>boxes</span></button></div><textarea autofocus readonly id="note-text" placeholder="what’s on your mind?" maxlength="10000" rows="5"></textarea><div id="recording-line" role="status" hidden></div><div id="draft-audio" hidden><audio id="draft-player" controls preload="metadata"></audio></div></div><div class="composer-bottom"><button type="button" id="record" class="record"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="2" width="6" height="13" rx="3" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3" fill="none" stroke="currentColor" stroke-width="1.6"/></svg><span>record voice</span></button><button class="primary" id="save" type="submit">save note <span aria-hidden="true">↑</span></button></div></div><p id="feedback" role="status" aria-live="polite"></p></form>
<div class="backup-row"><button class="quiet" id="backup">export backup</button></div>
</main></div>
<dialog id="copy-dialog"><div class="dialog-heading"><h2>copy your note</h2><button id="copy-close" class="quiet">close</button></div><label for="copy-text">select and copy this text into your AI chat</label><textarea id="copy-text" readonly rows="10"></textarea></dialog>
</body></html>
