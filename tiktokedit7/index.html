<!doctype html>
<html lang="en">
<head><base href="/tiktokedit7/"><meta name="robots" content="noindex,nofollow"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>navy stripey · video review</title><link rel="stylesheet" href="style.css?v=20261024-really-like"><script defer src="common.js?v=20261024-really-like"></script><script defer src="app.js?v=20261024-really-like"></script></head>
<body>
<header class="page-header"><div><h1>navy stripey</h1><p>like a clip with its button. tap its frame to dislike. tap again to undo.</p></div><a id="results-link" href="results.html">saved feedback</a></header>
<main>
  <div class="round-row"><label for="round">review round</label><select id="round" aria-label="review round"></select><span id="count">loading videos…</span><span id="autosave" role="status" aria-live="polite"></span></div>
  <div id="summary" class="summary" aria-label="feedback summary"></div>
  <div id="videos"></div>
  <section class="submit" aria-labelledby="feedback-heading"><h2 id="feedback-heading">overall comment</h2><p class="feedback-help">feedback saves automatically. copy or download it any time.</p><textarea id="overall" maxlength="30000" aria-label="overall comment" placeholder="anything else for the next edit?" rows="3"></textarea><div class="send-row"><input id="name" maxlength="200" aria-label="your name, optional" placeholder="your name (optional)" autocomplete="name"><button id="save">save feedback</button><button id="copy">copy feedback</button><button id="download">download feedback</button></div><p id="status" role="status" aria-live="polite"></p><div id="copy-fallback" hidden><label for="copy-text">copy this text</label><textarea id="copy-text" readonly rows="8"></textarea></div></section>
</main>
</body></html>
