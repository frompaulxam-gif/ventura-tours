<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>lightskin video review</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="style.css?v=20261024-really-like"></head>
<body><main>
<header class="page-header"><div><h1>lightskin edits</h1><p class="muted">like or dislike a video. tap a clip frame to reject that cut.</p></div><div class="header-actions"><label class="round-control">review round<select id="round" aria-label="review round"></select></label><a id="results-link" href="results.html">saved answers</a></div></header>
<div id="board" class="video-grid" aria-busy="true"><p class="empty">loading your videos…</p></div>
<section class="overall"><div><h2>overall comment</h2><p class="muted">anything you want changed across the videos</p></div><div><label class="sr-only" for="overall">overall comment</label><textarea id="overall" rows="3" placeholder="add your comment"></textarea><label for="reviewer" class="name-label">name <span class="muted">(optional)</span></label><input id="reviewer" maxlength="100" autocomplete="name" placeholder="your name"></div></section>
<section class="feedback-panel" aria-labelledby="summary-title"><div><h2 id="summary-title">feedback summary</h2><div id="summary" aria-live="polite"></div><p id="save-state" role="status" aria-live="polite">feedback saves automatically online and in this browser</p></div><div class="export-actions"><button id="copy">copy feedback</button><button id="download">download feedback</button><button id="save" class="primary">send answers</button></div></section>
<section id="fallback" hidden><label for="copy-text">copy this text</label><textarea id="copy-text" readonly rows="10"></textarea><button id="close-fallback">close</button></section>
</main><script src="review.js?v=20261024-really-like" defer></script></body></html>
