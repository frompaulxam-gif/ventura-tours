<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>PaulQC results</title><link rel="stylesheet" href="style.css"><link rel="icon" href="favicon.svg"></head><body><header><h1>Results</h1><nav><a href="index.html">Review</a></nav></header><main class="results"><button id="refresh">Refresh</button><div id="out" aria-live="polite">Loading…</div></main><script src="config.js"></script><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){try{let data;if(CONFIG.store){let r=await fetch(CONFIG.store+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error();data=await r.json()}else{data=JSON.parse(localStorage.getItem('paulqc:'+CONFIG.id+':submissions')||'{"submissions":[]}')}let m=await fetch('manifest.json');if(!m.ok)throw Error();let manifest=await m.json(),ids=manifest.items.flatMap(i=>i.variants.filter(v=>!v.reference).map(v=>v.id));let subs=(data.submissions||[]).sort((a,b)=>new Date(b.ts)-new Date(a.ts));let totals=Object.fromEntries(ids.map(id=>[id,{K:0,F:0,X:0}]));let people=subs.map(s=>{let rows=ids.map(id=>{let n=(s.ids||[]).indexOf(id),v=n<0?'-':s.answers[n],note=s.notes?.[id]||'';if(note.trim()&&v!=='X')v='F';if(totals[id][v]!==undefined)totals[id][v]++;return '<tr><td>'+esc(id)+'</td><td>'+({K:'Keep',F:'Flag',X:'Kill'}[v]||'—')+'</td><td class="result-note">'+esc(note)+'</td></tr>'}).join('');return '<section class="person"><h2>'+esc(s.name)+'</h2><p class="muted">'+esc(new Date(s.ts).toLocaleString('en-GB'))+'</p><table><thead><tr><th>Item</th><th>Verdict</th><th>Notes</th></tr></thead><tbody>'+rows+'</tbody></table>'+(s.overall?'<p class="result-note">'+esc(s.overall)+'</p>':'')+'</section>'}).join('');document.querySelector('#out').innerHTML='<h2>Totals · '+subs.length+' people</h2><table><thead><tr><th>Item</th><th>Keep</th><th>Flag</th><th>Kill</th></tr></thead><tbody>'+ids.map(id=>'<tr><td>'+esc(id)+'</td><td>'+totals[id].K+'</td><td>'+totals[id].F+'</td><td>'+totals[id].X+'</td></tr>').join('')+'</tbody></table>'+people}catch(e){document.querySelector('#out').textContent='Could not load answers. Press Refresh.'}}
document.querySelector('#refresh').onclick=load;load();</script></body></html>
